<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Komunikaty systemowe</title>

</head>
<body>
<main class="container py-5">
    <h1 class="text-primary mb-2">Komunikaty systemowe</h1>
    <p class="lead mb-4">Panel prezentujący przykładowe stany aplikacji.</p>
    <div class="alert alert-info" role="alert">ℹ️ Dostępna jest nowa wersja aplikacji. Sprawdź listę zmian.</div>
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
        ⚠️ Kończy się miejsce na dysku. Zwolnij niepotrzebne pliki.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Zamknij"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
        ❌ Nie udało się połączyć z bazą danych. Spróbuj ponownie później.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Zamknij"></button>
    </div>
    <button id="saveButton" class="btn btn-primary">Zapisz dane</button>
    <div id="saveAlert" class="alert alert-success alert-dismissible fade show mt-3 d-none" role="alert">
        ✅ Dane zostały pomyślnie zapisane.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Zamknij"></button>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('saveButton').addEventListener('click', () => {
    const alert = document.getElementById('saveAlert');
    alert.classList.remove('d-none');
});
</script>
</body>
</html>
