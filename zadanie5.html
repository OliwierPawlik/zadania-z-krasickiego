<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Rejestracja użytkownika</title>

</head>
<body>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-9">
            <h1 class="text-primary text-center mb-2">Rejestracja użytkownika</h1>
            <p class="lead text-center mb-4">Dołącz do szkolnej platformy programistycznej.</p>
            <form id="registrationForm" class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="fullName" class="form-label">Imię i nazwisko</label>
                    <input type="text" class="form-control" id="fullName" name="fullName" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="email" class="form-label">Adres e-mail</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="password" class="form-label">Hasło</label>
                    <input type="password" class="form-control" id="password" name="password" required minlength="6">
                </div>
                <div class="col-12 col-md-6">
                    <label for="confirmPassword" class="form-label">Powtórz hasło</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required minlength="6">
                </div>
                <div class="col-12 col-md-6">
                    <label for="className" class="form-label">Klasa</label>
                    <select class="form-select" id="className" name="className" required>
                        <option value="" selected disabled>Wybierz klasę</option>
                        <option>1 TP</option><option>2 TP</option><option>3 TP</option><option>4 TP</option><option>5 TP</option>
                    </select>
                </div>
                <div class="col-12 col-md-6">
                    <label for="language" class="form-label">Ulubiony język programowania</label>
                    <select class="form-select" id="language" name="language" required>
                        <option value="" selected disabled>Wybierz język</option>
                        <option>JavaScript</option><option>Python</option><option>PHP</option><option>Java</option><option>C++</option>
                    </select>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="terms" required>
                        <label class="form-check-label" for="terms">Akceptuję regulamin platformy.</label>
                    </div>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Utwórz konto</button>
                </div>
            </form>
            <div id="successMessage" class="alert alert-success mt-4 d-none" role="alert">Rejestracja przebiegła pomyślnie. Dziękujemy za dołączenie!</div>
            <div id="errorMessage" class="alert alert-danger mt-4 d-none" role="alert">Podane hasła nie są identyczne.</div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const registrationForm = document.getElementById('registrationForm');
const successMessage = document.getElementById('successMessage');
const errorMessage = document.getElementById('errorMessage');
registrationForm.addEventListener('submit', (event) => {
    event.preventDefault();
    successMessage.classList.add('d-none');
    errorMessage.classList.add('d-none');
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if (password !== confirmPassword) {
        errorMessage.classList.remove('d-none');
        return;
    }
    successMessage.classList.remove('d-none');
    registrationForm.reset();
});
</script>
</body>
</html>
