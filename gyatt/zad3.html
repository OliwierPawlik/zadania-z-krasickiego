<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moja strona Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>
<div class="container py-4">
  <h1 class="text-primary">Moje Projekty</h1>
  <div class="card">
    <div class="card h-100">
      <img class="card-img-top" src="img/Eryk.png">
      <div class="card-body">
        <h2 class="card-title">Eryk</h2>
        <p class="card-text">Eryk</p>
        <button class="btn btn-outline-primary">Zobacz</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card h-100">
      <img class="card-img-top" src="img/obraz.jpg">
      <div class="card-body">
        <h2 class="card-title">galeria zdjęć</h2>
        <p class="card-text">dużo znanych artystów jak nwm michał anioł (archangel michael)</p>
        <button class="btn btn-outline-primary">Zobacz</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card h-100">
      <img class="card-img-top" src="img/showdown.png">
      <div class="card-body">
        <h2 class="card-title">Pokemon Showdown</h2>
        <p class="card-text"><i>"całkiem spoko gra, polecam "</i>- żul siedziący przy biedronce</p>
        <button class="btn btn-outline-primary">Zobacz</button>
      </div>
    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<style>
  img {
    width: 250px;
    height: 250px;
  }
  div {
    width: 500px;
  }


</style>
</body>
</html>
